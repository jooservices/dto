name: Prepare self-hosted workspace
description: Fix root-owned Docker artifacts and map container UID to the runner user

runs:
  using: composite
  steps:
    - name: Repair workspace permissions
      shell: bash
      run: |
        set -euo pipefail
        if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
            2>/dev/null \
            || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" \
            2>/dev/null \
            || true
        fi

    - name: Map Docker Compose to runner user
      shell: bash
      run: |
        echo "DOCKER_UID=$(id -u)" >> "${GITHUB_ENV}"
        echo "DOCKER_GID=$(id -g)" >> "${GITHUB_ENV}"
