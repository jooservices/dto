name: Workflow audit

on:
  push:
    branches: [master, develop]
    paths:
      - '.github/**'
  pull_request:
    branches: [master, develop]
    paths:
      - '.github/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: dto-runner1-workspace
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color

  zizmor:
    name: Zizmor
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          format: sarif
          output: zizmor.sarif

      - name: Upload zizmor SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
