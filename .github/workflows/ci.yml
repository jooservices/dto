# Dedicated CI for jooservices/dto — GitHub-hosted runners
# Pull-request quality gate: full pipeline. Post-merge heads run ci-post-merge.yml.
name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer validate
        run: tools/ci/docker-compose run --rm php composer validate --strict

  lint:
    name: Lint (${{ matrix.name }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Pint
            command: composer lint:pint
          - name: PHPCS
            command: composer lint:phpcs
          - name: PHPStan
            command: composer lint:phpstan
          - name: PHPMD
            command: composer lint:phpmd
          - name: PHP-CS-Fixer
            command: composer lint:cs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run linter
        run: tools/ci/docker-compose run --rm php ${{ matrix.command }}

  security:
    name: Security (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Dependencies
          - name: Secrets
          - name: SAST
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build PHP image
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        if: matrix.name == 'Dependencies'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: matrix.name == 'Dependencies' && steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer audit
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose run --rm php composer audit

      - name: OSV Scanner
        if: matrix.name == 'Dependencies'
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            .

      - name: Dependency Review
        if: matrix.name == 'Dependencies'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Gitleaks OSS CLI
        if: matrix.name == 'Secrets'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --exit-code 1

      - name: Semgrep (OSS)
        if: matrix.name == 'SAST'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep scan --config p/php --error

  project-docker-scans:
    name: Project Docker scans
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the local scanner target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DTO_GITLEAKS_BASE_REF: origin/develop
        run: make scan

  test:
    name: Test (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Unit
            suite: Unit
          - name: Integration
            suite: Integration
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run test suite with coverage
        run: |
          mkdir -p build/coverage
          tools/ci/docker-compose run --rm php ./vendor/bin/phpunit \
            --testsuite=${{ matrix.suite }} \
            --coverage-clover=build/coverage/clover-${{ matrix.suite }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.suite }}
          path: build/coverage/clover-${{ matrix.suite }}.xml
          if-no-files-found: error

  coverage:
    name: Coverage upload
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: build/coverage/matrix
          merge-multiple: true

      - name: Enforce coverage and merge Clover reports
        run: |
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Unit.xml
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Integration.xml
          tools/ci/docker-compose run --rm php php tools/coverage-merge.php \
            build/coverage/matrix/clover-Unit.xml \
            build/coverage/matrix/clover-Integration.xml \
            build/coverage/clover-combined.xml
          ls -la build/coverage

      - name: Upload to Codecov
        if: github.event.pull_request.user.type != 'Bot'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/clover-combined.xml
          fail_ci_if_error: true
          verbose: true

      - name: Build Project Docker Sonar scanner
        if: github.event.pull_request.user.type != 'Bot'
        run: tools/ci/docker-compose --profile tools build sonar-scanner

      - name: Run SonarQube analysis in Project Docker
        if: github.event.pull_request.user.type != 'Bot'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_BASE: ${{ github.base_ref }}
        run: |
          cp build/coverage/clover-combined.xml coverage.xml
          tools/run-sonar-cloud \
            "-Dsonar.pullrequest.key=${SONAR_PR_KEY}" \
            "-Dsonar.pullrequest.branch=${SONAR_PR_BRANCH}" \
            "-Dsonar.pullrequest.base=${SONAR_PR_BASE}"
