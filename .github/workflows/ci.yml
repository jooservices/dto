# Dedicated CI for jooservices/dto — self-hosted runner1 (Linux X64)
# Never uses jooservices/workflows.
# PHP image: tools/ci/docker-compose (host daemon). No Buildx — runner1 cannot pull moby/buildkit from Docker Hub (IPv6 unreachable).
# actions/cache@v5 requires Actions Runner >= 2.327.1 (Node 24 action runtime).
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  id-token: write
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare self-hosted Docker
        uses: ./.github/actions/self-hosted-prepare

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v5
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer validate
        run: tools/ci/docker-compose run --rm php composer validate --strict

  lint:
    name: Lint (${{ matrix.name }})
    needs: [validate]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pint
            command: composer lint:pint
          - name: PHPCS
            command: composer lint:phpcs
          - name: PHPStan
            command: composer lint:phpstan
          - name: PHPMD
            command: composer lint:phpmd
          - name: PHP-CS-Fixer
            command: composer lint:cs
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare self-hosted Docker
        uses: ./.github/actions/self-hosted-prepare

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v5
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run linter
        run: tools/ci/docker-compose run --rm php ${{ matrix.command }}

  test:
    name: Test (${{ matrix.name }})
    needs: [lint]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit
            suite: Unit
          - name: Integration
            suite: Integration
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare self-hosted Docker
        uses: ./.github/actions/self-hosted-prepare

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v5
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run test suite with coverage
        run: |
          mkdir -p build/coverage
          tools/ci/docker-compose run --rm php ./vendor/bin/phpunit \
            --testsuite=${{ matrix.suite }} \
            --coverage-clover=build/coverage/clover-${{ matrix.suite }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.suite }}
          path: build/coverage/clover-${{ matrix.suite }}.xml
          if-no-files-found: error

  dependency-security:
    name: Dependency security
    needs: [validate]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare self-hosted Docker
        uses: ./.github/actions/self-hosted-prepare

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v5
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: tools/ci/docker-compose run --rm php composer audit

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            .

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5

  secret-scan:
    name: Secret scan
    needs: [validate]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare self-hosted Docker
        uses: ./.github/actions/self-hosted-prepare

      - name: Gitleaks OSS CLI
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --exit-code 1

  sast:
    name: SAST
    needs: [validate]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Semgrep (OSS)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/php

  coverage:
    name: Coverage upload
    needs: [test, dependency-security, secret-scan, sast]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare self-hosted Docker
        uses: ./.github/actions/self-hosted-prepare

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: build/coverage/matrix
          merge-multiple: true

      - name: Enforce coverage and merge Clover reports
        run: |
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Unit.xml
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Integration.xml
          tools/ci/docker-compose run --rm php php tools/coverage-merge.php \
            build/coverage/matrix/clover-Unit.xml \
            build/coverage/matrix/clover-Integration.xml \
            build/coverage/clover-combined.xml
          ls -la build/coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/clover-combined.xml
          fail_ci_if_error: true
          verbose: true

      - name: SonarQube Scan
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          host_url="${SONAR_HOST_URL%/}"
          if [ -z "${host_url}" ]; then
            echo "SONAR_HOST_URL is required"
            exit 1
          fi
          case "${host_url}" in
            http://*|https://*) ;;
            *) host_url="https://${host_url}" ;;
          esac
          if [[ ! "${host_url}" =~ ^https?://[^[:space:]/]+ ]]; then
            echo "SONAR_HOST_URL must be a valid HTTP(S) URL"
            exit 1
          fi
          echo "host_url=${host_url}" >> "${GITHUB_OUTPUT}"

      - name: Upload SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.host_url }}
        with:
          args: >
            -Dsonar.php.coverage.reportPaths=build/coverage/clover-combined.xml
