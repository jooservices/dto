# Tag-driven release — only after owner go-ahead. Dedicated; no jooservices/workflows.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: dto-runner1-workspace
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  release:
    name: Release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prepare self-hosted Docker
        uses: ./.github/actions/self-hosted-prepare

      - name: Verify tag commit is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "Refusing release: tag commit is not on origin/master"
            exit 1
          fi

      - name: Build PHP image
        run: docker compose build php

      - name: Install dependencies
        run: docker compose run --rm php composer install --no-interaction --prefer-dist

      - name: Validate
        run: docker compose run --rm php composer validate --strict

      - name: Lint
        run: docker compose run --rm php composer lint

      - name: Test with coverage
        run: |
          mkdir -p build/coverage
          docker compose run --rm php ./vendor/bin/phpunit \
            --coverage-clover=build/coverage/clover-all.xml

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: jooservices/dto:php85
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "Packagist secrets missing"
            exit 1
          fi
          curl -X POST "https://packagist.org/api/update-package" \
            -H "Content-Type: application/json" \
            -u "${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/jooservices/dto"}}'
