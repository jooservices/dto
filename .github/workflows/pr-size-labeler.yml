name: PR size labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  size-label:
    name: Label PR by size
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Repair workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/vendor" ] || [ -d "${GITHUB_WORKSPACE}/build" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine chown -R "$(id -u):$(id -g)" /w \
              2>/dev/null || sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Size label
        uses: pascalgn/size-label-action@v0.5.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          sizes: >
            {
              "0": "size/XS",
              "30": "size/S",
              "100": "size/M",
              "500": "size/L",
              "1000": "size/XL",
              "-1": "size/XXL"
            }
